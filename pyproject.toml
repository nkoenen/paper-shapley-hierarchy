[project]
name = "entropy_shapley"
version = "1.0.0"
description = "Reproduction code for 'A Hierarchy of Entropy-Shapley Games for Multivariate Predictive Uncertainty'."
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.2.0",
    "ipywidgets>=8.0",
    "matplotlib>=3.10.8",
    "seaborn>=0.13",
    "ngboost>=0.5.10",
    "scikit-learn>=1.0",
    "shap>=0.44",
    "numpy>=2.4.2",
    "pandas>=2.0,<3",
    "scipy>=1.0",
    "shapiq>=0.1",
    "torch",
    "pytorch-lightning",
    "pytorch-forecasting>=1.0",
    "nbconvert>=7.17.1",
    "chronos-forecasting>=2.2",
    "lightgbm>=4.6.0",
]

[tool.setuptools]
packages = ["entropy_shapley"]

[tool.uv]
override-dependencies = [
    "numpy>=2.0",
    "numba>=0.65",
    "scipy>=1.14",
    "torch>=2.5",
    # chronos-forecasting -> transformers 4.57 needs huggingface-hub<1.0,>=0.34;
    # the unconstrained resolver lands on hf-hub 1.x and breaks transformers'
    # import-time check. Pin it inside the transformers-compatible range.
    "huggingface-hub>=0.34,<1.0",
]


[tool.uv.sources]
torch = [
    { index = "pytorch-cu124" },
]
torchvision = [
    { index = "pytorch-cu124" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
